{% extends "base.html" %}
{% block title %}{{ object.subject }} — Сообщение{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between">
        <h3>{{ object.subject }}</h3>
        <a href="{% url 'mailing:message_update' object.pk %}" class="btn btn-sm btn-primary"><i class="bi bi-pencil"></i> Изменить</a>
    </div>
    <div class="card-body">
        <p><strong>Текст сообщения:</strong></p>
        <pre class="bg-light p-3 rounded">{{ object.message|default:"(пусто)" }}</pre>
    </div>
</div>
<div class="mt-3">
    <a href="{% url 'mailing:message_list' %}" class="btn btn-outline-secondary">← Назад</a>
    <a href="{% url 'mailing:message_delete' object.pk %}" class="btn btn-outline-danger">Удалить</a>
</div>
{% endblock %}
