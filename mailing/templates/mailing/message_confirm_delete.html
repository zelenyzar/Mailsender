{% extends "base.html" %}
{% block title %}Удаление сообщения{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger shadow-sm">
            <div class="card-header bg-danger text-white"><h4><i class="bi bi-exclamation-triangle"></i> Удаление шаблона</h4></div>
            <div class="card-body text-center">
                <p>Вы уверены, что хотите удалить шаблон <strong>"{{ object.subject }}"</strong>?</p>
                <form method="post">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                    <a href="{% url 'mailing:message_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
