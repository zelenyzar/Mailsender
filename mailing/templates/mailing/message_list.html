{% extends "base.html" %}
{% block title %}Шаблоны сообщений{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2 class="fw-bold">Шаблоны сообщений</h2>
    <a href="{% url 'mailing:message_create' %}" class="btn btn-success"><i class="bi bi-plus-lg"></i> Новый шаблон</a>
</div>
<table class="table table-hover bg-white shadow-sm rounded">
    <thead class="table-dark"><tr><th>Тема</th><th>Текст</th><th class="text-end">Действия</th></tr></thead>
    <tbody>
        {% for msg in object_list %}
        <tr>
            <td><a href="{% url 'mailing:message_detail' msg.pk %}">{{ msg.subject }}</a></td>
            <td class="text-truncate" style="max-width:300px">{{ msg.message|default:"(пусто)" }}</td>
            <td class="text-end">
                <a href="{% url 'mailing:message_update' msg.pk %}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a>
                <a href="{% url 'mailing:message_delete' msg.pk %}" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></a>
            </td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center py-4 text-muted">Шаблонов нет</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
