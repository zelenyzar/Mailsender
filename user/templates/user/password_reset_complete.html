{% extends "base.html" %}
{% block title %}Пароль изменен{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4 text-center">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0"><i class="bi bi-shield-lock"></i> Пароль изменен</h4>
            </div>
            <div class="card-body">
                <p class="lead">Ваш пароль был успешно обновлен.</p>
                <p class="text-muted">Теперь вы можете войти в систему, используя новый пароль.</p>
                
                <hr>
                <a href="{% url 'user:login' %}" class="btn btn-primary">Войти в систему</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
