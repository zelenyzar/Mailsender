{% extends "base.html" %}
{% block title %}Письмо отправлено{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm p-4 text-center">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-envelope-check"></i> Письмо отправлено</h4>
            </div>
            <div class="card-body">
                <p class="lead text-muted">Мы отправили инструкции по сбросу пароля на адрес:</p>
                <div class="alert alert-info">
                    <strong>{{ form.data.email }}</strong>
                </div>
                <p>Проверьте папку «Входящие» (и «Спам») и следуйте инструкциям в письме.</p>
                
                <hr>
                <a href="{% url 'user:login' %}" class="btn btn-outline-secondary">Вернуться ко входу</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
