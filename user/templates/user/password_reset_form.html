{% extends "base.html" %}
{% block title %}Восстановление пароля{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-4">
    <div class="card p-4"><div class="card-header"><h4>Восстановление пароля</h4></div>
    <div class="card-body">
        <form method="post">{% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Отправить инструкцию</button>
        </form>
        <p><a href="{% url 'user:login' %}">Вернуться ко входу</a></p>
    </div></div></div></div>
{% endblock %}
